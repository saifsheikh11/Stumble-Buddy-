
name: Build Stumble Buddy APK

on:
  workflow_dispatch:
  push:
    paths:
      - "StumbleBuddy-Android-Project.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q StumbleBuddy-Android-Project.zip
          test -f StumbleBuddy/settings.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle -p StumbleBuddy assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StumbleBuddy-APK
          path: StumbleBuddy/app/build/outputs/apk/debug/*.apk
